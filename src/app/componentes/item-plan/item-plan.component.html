<ion-item-sliding>
  <ion-item button (click)="editar.emit(actividad())">
    <ion-label>
      <h3>{{ actividad().hora }} · {{ actividad().titulo }}</h3>
      <p>{{ actividad().tipo }}</p>
    </ion-label>
  </ion-item>
  <ion-item-options side="end">
    <ion-item-option color="danger" (click)="eliminar.emit(actividad())">Borrar</ion-item-option>
  </ion-item-options>
</ion-item-sliding>
